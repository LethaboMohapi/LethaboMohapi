<svg xmlns="http://www.w3.org/2000/svg" width="920" height="18" viewBox="0 0 920 18" role="img" aria-label="">
  <defs>
    <linearGradient id="line"><stop stop-color="#7aa2f7" stop-opacity="0"/><stop offset=".3" stop-color="#7aa2f7"/><stop offset=".7" stop-color="#bb9af7"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/></linearGradient>
    <linearGradient id="comet"><stop stop-color="#7dcfff" stop-opacity="0"/><stop offset="1" stop-color="#7dcfff"/></linearGradient>
